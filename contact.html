    <main>
        <section>
            <h2>Contact Me</h2>
            <p>You can reach me directly via email: <a href="mailto:studyforme@gamil.com">studyforme@gamil.com</a> or phone: <a href="tel:01548925371">01548925371</a></p>
            
            <hr>

            <h3>Send me a message</h3>
            <form action="#" method="POST">
                <div>
                    <label for="name">Full Name:</label><br>
                    <input type="text" id="name" name="name" required>
                </div>
                <br>
                <div>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" required>
                </div>
                <br>
                <div>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password">
                </div>
                <br>
                <div>
                    <label for="age">Age / Number:</label><br>
                    <input type="number" id="age" name="age">
                </div>
                <br>
                <div>
                    <label for="subject">Inquiry Type:</label><br>
                    <select id="subject" name="subject">
                        <option value="general">General Inquiry</option>
                        <option value="project">Project Offer</option>
                        <option value="support">Support</option>
                    </select>
                </div>
                <br>
                <div>
                    <label for="message">Your Message:</label><br>
                    <textarea id="message" name="message" rows="4" cols="30"></textarea>
                </div>
                <br>
                <button type="submit">Submit Message</button>
            </form>
        </section>
    </main>
